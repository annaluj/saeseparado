<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <form action="../BACK-END/cadastrar.php" method="post" enctype="multipart/form-data" class="cadastro">

        <h2>Dados do usuário</h2>

        <div class="foto-usuario">
            <img width="200" id="imagem-preview" src="#" alt="Prévia da foto">
        </div>

        <input type="file" id="input-foto" name="foto" accept="image/*">

        <input type="text" name="nome" placeholder="Nome" maxlength="100" required>
        <input type="email" name="email" placeholder="Email" maxlength="255" required>
        <input type="password" name="senha" placeholder="Senha (mínimo 8 caracteres)" minlength="8" maxlength="72" required>

        <h2>Endereço</h2>

        <input type="text" name="rua" placeholder="Rua" maxlength="150" required>
        <input type="text" name="cep" placeholder="CEP" maxlength="10" required>
        <input type="text" name="numero_casa" placeholder="Número" maxlength="10" required>
        <input type="text" name="bairro" placeholder="Bairro" maxlength="100" required>
        <input type="text" name="cidade" placeholder="Cidade" maxlength="100" required>

        <br>

        <button type="submit">Cadastrar</button>

        <button type="button" class="btn-voltar" data-href="index.html">Voltar</button>

    </form>

    <script src="comum.js"></script>
    <script src="pagina01.js"></script>

</body>
</html>
